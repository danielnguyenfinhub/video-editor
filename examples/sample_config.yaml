# ───────────────────────────────────────────────────────────────
#  Per-video config override — inherits from style_presets.yaml
# ───────────────────────────────────────────────────────────────

format: vertical
whisper_model: small      # better accuracy for Vietnamese
language: vi              # Vietnamese

analysis:
  enabled: true
  apply_effects: true
  language_hint: "Vietnamese finance content about home loans"
  max_keywords: 6

color_grade: cinematic
color_grade_options:
  saturation: 0.3
  contrast: 1.2
  brightness: -0.05

attention:
  zoom_punch:
    enabled: true
    scale: 1.06
  color_flash:
    enabled: true
    color: [255, 200, 0]

captions:
  enabled: true
  font_size: 72
  words_per_line: 3
  highlight_color: "#FFE000"

text_overlays:
  - text: "💡 Bạn có biết?"
    position: top_center
    font_size: 60
    color: white
    start: 0
    duration: 2.5
    animation: fade_slide_down
